name: Daily Telugu Story Agent

on:
workflow_dispatch:
schedule:
- cron: "30 3 * * *"

permissions:
contents: write

jobs:
generate-story:
runs-on: ubuntu-latest
steps:
- name: Get repository code
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: pip install -r requirements.txt

  - name: Generate Telugu story
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python story_agent.py

  - name: Save story to GitHub
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add stories/latest-story.md
      git diff --cached --quiet || git commit -m "Add generated Telugu story"
      git push
