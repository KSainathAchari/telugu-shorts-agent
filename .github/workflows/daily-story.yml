
name: Daily Telugu Story Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Telugu story and voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_agent.py

      - name: Create YouTube Short
        run: python make_video.py

      - name: Save story, voice, and video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/latest-story.md stories/latest-voice.mp3 stories/latest-short.mp4
          git diff --cached --quiet || git commit -m "Save generated Telugu story, voice, and video"
          git push
          
